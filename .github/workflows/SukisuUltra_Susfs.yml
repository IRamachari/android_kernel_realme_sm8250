name: Build Kernel (SukiSU Ultra + SuSFS + GPU OC)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release after build"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: "phoeniX | SM8250 | SukiSU Ultra + SuSFS + GPU OC"
    runs-on: ubuntu-24.04

    steps:
      # ─── 1. Checkout kernel source ───────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      # ─── 2. System dependencies ──────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache \
            curl flex git kmod libelf-dev libssl-dev \
            lz4 python3 unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu cpio \
            clang-20 lld-20 rsync

      # ─── 3. ccache ───────────────────────────────────────────────────
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 5G
          key: phoenix-sm8250-${{ github.ref_name }}
          restore-keys: phoenix-sm8250-

      # ─── 4. AnyKernel3 ───────────────────────────────────────────────
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/bijoyv9/AnyKernel3.git \
            kernel/anykernel

      # ─── 5. SukiSU Ultra — susfs-main branch ─────────────────────────
      - name: Add SukiSU Ultra (susfs-main) to kernel source tree
        working-directory: kernel
        run: |
          echo "──────────────────────────────────────"
          echo " Adding SukiSU Ultra (susfs-main)"
          echo "──────────────────────────────────────"
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s susfs-main
          echo "✔ KernelSU tree added"

      # ─── 6. Fix kernel 4.19 + Clang 20 compatibility ────────────────
      - name: Fix KernelSU driver kernel 4.19 + Clang 20 compatibility
        working-directory: kernel
        run: |
          set -e

          INIT_C="drivers/kernelsu/core/init.c"
          if [ -f "$INIT_C" ] && grep -q "MODULE_IMPORT_NS" "$INIT_C"; then
            python3 - <<'PYEOF'
          import re
          path = "drivers/kernelsu/core/init.c"
          with open(path, "r", encoding="utf-8", errors="ignore") as f:
              src = f.read()

          marker = "KSU_419_COMPAT_MODULE_IMPORT_NS"
          if marker not in src:
              if "#include <linux/version.h>" not in src:
                  src = "#include <linux/version.h>\n" + src

              src = re.sub(
                  r'(MODULE_IMPORT_NS\([^)]+\);)',
                  r'#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 4, 0)\n\1\n#endif',
                  src
              )

              src = "/* " + marker + " */\n" + src

              with open(path, "w", encoding="utf-8") as f:
                  f.write(src)
              print("  ✔ Wrapped MODULE_IMPORT_NS with version guard")
          else:
              print("  -- Already patched:", path)
          PYEOF
          else
            echo "  -- $INIT_C not found or no MODULE_IMPORT_NS usage"
          fi

          MAKEFILE="drivers/kernelsu/Makefile"
          if [ -f "$MAKEFILE" ] && ! grep -q "Wno-implicit-int" "$MAKEFILE"; then
            printf '\nccflags-y += -Wno-implicit-int -Wno-implicit-function-declaration -Wno-int-conversion\n' >> "$MAKEFILE"
            echo "  ✔ Added Clang 20 tolerance flags to $MAKEFILE"
          fi

      # ─── 7. Manual hooks for non-GKI kernel 4.19 ─────────────────────
      - name: Apply SukiSU Ultra manual hooks
        working-directory: kernel
        run: |
          python3 - <<'PYEOF'
          import re

          def patch_file(path, replacements):
              try:
                  with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                      src = f.read()
              except FileNotFoundError:
                  print(f"  !! {path} not found — skipping")
                  return False

              original = src
              for pattern, replacement in replacements:
                  src, n = re.subn(pattern, replacement, src, flags=re.MULTILINE | re.DOTALL)
                  if n == 0:
                      print(f"  ?? no match: {repr(pattern[:60])}")

              if src == original:
                  print(f"  -- {path}: no changes")
                  return False

              with open(path, 'w', encoding='utf-8') as f:
                  f.write(src)

              print(f"  ✔ patched: {path}")
              return True

          print("═══════════════════════════════════════")
          print(" SukiSU Ultra manual hooks (4.19)")
          print("═══════════════════════════════════════")

          # fs/stat.c
          print("\n→ fs/stat.c")
          patch_file("fs/stat.c", [
              (
                  r'(#if !defined\(__ARCH_WANT_STAT64\) \|\| defined\(__ARCH_WANT_SYS_NEWFSTATAT\))',
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n'
                  'extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n'
                  '#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\n'
                  'extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n'
                  '#endif\n'
                  '#endif\n\n'
                  r'\1'
              ),
              (
                  r'(SYSCALL_DEFINE4\(newfstatat, int, dfd, const char __user \*, filename,\s*struct stat __user \*, statbuf, int, flag\)\s*\{\s*)'
                  r'(\s*struct kstat stat;\s*\n\s*int error;\s*\n)',
                  r'\1'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_stat(&dfd, &filename, &flag);\n'
                  '#endif\n'
                  r'\2'
              ),
              (
                  r'(SYSCALL_DEFINE4\(fstatat64, int, dfd, const char __user \*, filename,\s*struct stat64 __user \*, statbuf, int, flag\)\s*\{\s*)'
                  r'(\s*struct kstat stat;\s*\n\s*int error;\s*\n)',
                  r'\1'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_stat(&dfd, &filename, &flag);\n'
                  '#endif\n'
                  r'\2'
              ),
              (
                  r'(SYSCALL_DEFINE2\(newfstat, unsigned int, fd, struct stat __user \*, statbuf\).+?if \(!error\)\s*\n\s*error = cp_new_stat\(&stat, statbuf\);)',
                  r'\1\n#ifdef CONFIG_KSU\n\tksu_handle_newfstat_ret(&fd, &statbuf);\n#endif'
              ),
              (
                  r'(SYSCALL_DEFINE2\(fstat64, unsigned long, fd, struct stat64 __user \*, statbuf\).+?if \(!error\)\s*\n\s*error = cp_new_stat64\(&stat, statbuf\);)',
                  r'\1\n#ifdef CONFIG_KSU\n\tksu_handle_fstat64_ret(&fd, &statbuf);\n#endif'
              ),
          ])

          # fs/exec.c
          print("\n→ fs/exec.c")
          patch_file("fs/exec.c", [
              (
                  r'(^int do_execve\(struct filename)',
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n'
                  '\t\t\t\tvoid *argv, void *envp, int *flags);\n'
                  '#endif\n\n'
                  r'\1'
              ),
              (
                  r'(int do_execve\(struct filename \*filename,\s*'
                  r'const char __user \*const __user \*__argv,\s*'
                  r'const char __user \*const __user \*__envp\)\s*\n\s*\{\s*\n'
                  r'\s*struct user_arg_ptr argv = \{ \.ptr\.native = __argv \};\s*\n'
                  r'\s*struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};\s*\n)'
                  r'(\s*return do_execveat_common)',
                  r'\1'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n'
                  '#endif\n'
                  r'\2'
              ),
          ])

          # fs/open.c
          print("\n→ fs/open.c")
          patch_file("fs/open.c", [
              (
                  r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\))',
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n'
                  '\t\t\t\tint *mode, int *flags);\n'
                  '#endif\n\n'
                  r'\1'
              ),
              (
                  r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\s*\n\{)\s*\n'
                  r'(\s*return do_faccessat)',
                  r'\1\n'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n'
                  '#endif\n'
                  r'\2'
              ),
          ])

          # kernel/reboot.c
          print("\n→ kernel/reboot.c")
          patch_file("kernel/reboot.c", [
              (
                  r'(SYSCALL_DEFINE4\(reboot, int, magic1, int, magic2, unsigned int, cmd,\s*\n\s*void __user \*, arg\))',
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_sys_reboot(int magic1, int magic2,\n'
                  '\t\t\tunsigned int cmd, void __user **arg);\n'
                  '#endif\n\n'
                  r'\1'
              ),
              (
                  r'(SYSCALL_DEFINE4\(reboot.*?\{.*?char buffer\[256\];\s*\n\s*int ret = 0;\s*\n)'
                  r'(\s*/\* We only trust)',
                  r'\1'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n'
                  '#endif\n'
                  r'\2'
              ),
          ])

          print("\n═══════════════════════════════════════")
          print(" ✔ All hooks applied")
          print("═══════════════════════════════════════")
          PYEOF

      # ─── 8. GPU frequency + voltage table ────────────────────────────
      - name: Patch GPU frequency and voltage table
        working-directory: kernel
        run: |
          python3 - <<'PYEOF'
          import os, re, glob

          NEW_PWRLEVELS = '''\
          qcom,gpu-pwrlevels-0 {
          	#address-cells = <0x1>;
          	#size-cells = <0x0>;
          	qcom,speed-bin = <0x0>;
          	qcom,initial-pwrlevel = <0x1>;
          	qcom,throttle-pwrlevel = <0>;

          	qcom,gpu-pwrlevel@0 {
          		reg = <0>;
          		qcom,gpu-freq = <0x27BC86C0>;
          		qcom,bus-freq-ddr7 = <0xb>; qcom,bus-min-ddr7 = <0xb>; qcom,bus-max-ddr7 = <0xb>;
          		qcom,bus-freq-ddr8 = <0xb>; qcom,bus-min-ddr8 = <0xb>; qcom,bus-max-ddr8 = <0xb>;
          		qcom,acd-level = <0x802b5ffd>;
          	};
          	qcom,gpu-pwrlevel@1 {
          		reg = <1>;
          		qcom,gpu-freq = <0x1F4ADD40>;
          		qcom,bus-freq-ddr7 = <0x9>; qcom,bus-min-ddr7 = <0x9>; qcom,bus-max-ddr7 = <0xb>;
          		qcom,bus-freq-ddr8 = <0x8>; qcom,bus-min-ddr8 = <0x8>; qcom,bus-max-ddr8 = <0xb>;
          		qcom,acd-level = <0x802b5ffd>;
          	};
          	qcom,gpu-pwrlevel@2 {
          		reg = <2>;
          		qcom,gpu-freq = <0x1D34CE80>;
          		qcom,bus-freq-ddr7 = <0x9>; qcom,bus-min-ddr7 = <0x6>; qcom,bus-max-ddr7 = <0x9>;
          		qcom,bus-freq-ddr8 = <0x8>; qcom,bus-min-ddr8 = <0x7>; qcom,bus-max-ddr8 = <0x9>;
          		qcom,acd-level = <0xa02b5ffd>;
          	};
          	qcom,gpu-pwrlevel@3 {
          		reg = <3>;
          		qcom,gpu-freq = <0x1A524800>;
          		qcom,bus-freq-ddr7 = <0x9>; qcom,bus-min-ddr7 = <0x6>; qcom,bus-max-ddr7 = <0x9>;
          		qcom,bus-freq-ddr8 = <0x8>; qcom,bus-min-ddr8 = <0x7>; qcom,bus-max-ddr8 = <0x9>;
          		qcom,acd-level = <0xa02b5ffd>;
          	};
          	qcom,gpu-pwrlevel@4 {
          		reg = <4>;
          		qcom,gpu-freq = <0x122DEE40>;
          		qcom,bus-freq-ddr7 = <0x7>; qcom,bus-min-ddr7 = <0x6>; qcom,bus-max-ddr7 = <0x9>;
          		qcom,bus-freq-ddr8 = <0x8>; qcom,bus-min-ddr8 = <0x6>; qcom,bus-max-ddr8 = <0x9>;
          		qcom,acd-level = <0xa02b5ffd>;
          	};
          	qcom,gpu-pwrlevel@5 {
          		reg = <5>;
          		qcom,gpu-freq = <0x08F0D180>;
          		qcom,bus-freq-ddr7 = <0x3>; qcom,bus-min-ddr7 = <0x2>; qcom,bus-max-ddr7 = <0x9>;
          		qcom,bus-freq-ddr8 = <0x3>; qcom,bus-min-ddr8 = <0x2>; qcom,bus-max-ddr8 = <0x9>;
          		qcom,acd-level = <0xa02b5ffd>;
          	};
          	qcom,gpu-pwrlevel@6 {
          		reg = <6>;
          		qcom,gpu-freq = <0x0>;
          		qcom,bus-freq = <0x0>; qcom,bus-min = <0x0>; qcom,bus-max = <0x0>;
          	};
          };'''

          NEW_OPP = '''\
          gpu_opp_table: opp-table {
          	compatible = "operating-points-v2";

          	opp-670000000 { opp-hz = /bits/ 64 <670000000>; opp-microvolt = <200>; };
          	opp-587000000 { opp-hz = /bits/ 64 <587000000>; opp-microvolt = <140>; };
          	opp-525000000 { opp-hz = /bits/ 64 <525000000>; opp-microvolt = <135>; };
          	opp-490000000 { opp-hz = /bits/ 64 <490000000>; opp-microvolt = <80>; };
          	opp-441600000 { opp-hz = /bits/ 64 <441600000>; opp-microvolt = <80>; };
          	opp-305000000 { opp-hz = /bits/ 64 <305000000>; opp-microvolt = <40>; };
          	opp-150000000 { opp-hz = /bits/ 64 <150000000>; opp-microvolt = <16>; };
          };'''

          candidates = [
              "arch/arm64/boot/dts/qcom/kona.dtsi",
              "arch/arm64/boot/dts/qcom/sm8250.dtsi",
              "arch/arm64/boot/dts/qcom/kona-gpu.dtsi",
          ]
          candidates += glob.glob("arch/arm64/boot/dts/**/*.dtsi", recursive=True)
          candidates += glob.glob("arch/arm64/boot/dts/**/*.dts", recursive=True)

          patched_pwrlevel = False
          patched_opp = False

          for path in candidates:
              if not os.path.isfile(path):
                  continue

              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  src = f.read()

              changed = False

              if not patched_pwrlevel and "qcom,gpu-pwrlevels-0" in src:
                  new_src, n = re.subn(
                      r'qcom,gpu-pwrlevels-0\s*\{.*?\};',
                      NEW_PWRLEVELS,
                      src,
                      flags=re.DOTALL
                  )
                  if n:
                      src = new_src
                      changed = True
                      patched_pwrlevel = True
                      print(f"  ✔ GPU power levels → {path}")

              if not patched_opp and ("gpu_opp_table" in src or "gpu-opp-table" in src):
                  new_src, n = re.subn(
                      r'gpu_opp_table\s*:\s*opp-table\s*\{.*?\};',
                      NEW_OPP,
                      src,
                      flags=re.DOTALL
                  )
                  if n:
                      src = new_src
                      changed = True
                      patched_opp = True
                      print(f"  ✔ GPU OPP voltage table → {path}")

              if changed:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(src)

          if not patched_pwrlevel:
              print("  ?? qcom,gpu-pwrlevels-0 not found in any DTS — skipping power level patch")
          if not patched_opp:
              print("  ?? gpu_opp_table not found in any DTS — skipping OPP voltage patch")
          PYEOF

      # ─── 9. Generate .config ─────────────────────────────────────────
      - name: Generate .config
        working-directory: kernel
        run: |
          set -e

          OUT_DIR="$(pwd)/out"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang-20
          export LD=ld.lld-20
          export LLVM=1
          export LLVM_IAS=1
          mkdir -p "${OUT_DIR}"

          echo "→ Generating base config"
          make O="${OUT_DIR}" vendor/kona-perf_defconfig

          if [ -f "vendor/oplus.config" ]; then
            echo "→ Merging vendor/oplus.config"
            ./scripts/kconfig/merge_config.sh -m -O "${OUT_DIR}" "${OUT_DIR}/.config" vendor/oplus.config
          fi

          echo "→ Enabling SukiSU Ultra Kconfig options"
          ./scripts/config --file "${OUT_DIR}/.config" \
            -e KSU \
            -e KSU_MANUAL_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            2>/dev/null || true

          echo "→ Enabling KALLSYMS + KALLSYMS_ALL"
          ./scripts/config --file "${OUT_DIR}/.config" \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            2>/dev/null || true

          make O="${OUT_DIR}" olddefconfig

          echo "✔ Config ready"
          echo "── Config verification ──────────────────"
          for opt in \
            CONFIG_KSU \
            CONFIG_KSU_MANUAL_HOOK \
            CONFIG_KALLSYMS \
            CONFIG_KALLSYMS_ALL \
            CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK; do
            val=$(grep "^${opt}=" "${OUT_DIR}/.config" 2>/dev/null || echo "${opt}=NOT SET")
            echo "  $val"
          done

      # ─── 10. Build kernel ────────────────────────────────────────────
      - name: Compile kernel
        working-directory: kernel
        run: |
          set -o pipefail
          set -e

          OUT_DIR="$(pwd)/out"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang-20
          export LD=ld.lld-20
          export LLVM=1
          export LLVM_IAS=1
          export USE_CCACHE=1
          export CCACHE_DIR="${HOME}/.ccache"
          export PATH="/usr/lib/ccache:${PATH}"

          echo "──────────────────────────────────────"
          echo " Building kernel"
          echo "──────────────────────────────────────"

          make O="${OUT_DIR}" -j"$(nproc --all)" Image dtbs 2>&1 | tee build.log || {
            echo "Image/dtbs build failed"
            exit 1
          }

          if make O="${OUT_DIR}" -n dtbo.img >/dev/null 2>&1; then
            make O="${OUT_DIR}" -j"$(nproc --all)" dtbo.img 2>&1 | tee -a build.log || true
          fi

          echo "✔ Kernel build complete"

      - name: Show build errors (on failure)
        if: failure()
        working-directory: kernel
        run: |
          if [ ! -f build.log ]; then
            echo "build.log not found — make did not start"
            exit 0
          fi
          echo "──────────────────────────────────────"
          echo " Last 120 lines of build.log"
          echo "──────────────────────────────────────"
          tail -n 120 build.log
          echo ""
          echo "── Filtered errors ───────────────────"
          grep -nE "error:|undefined reference|cannot find|fatal:|ld:" build.log \
            | tail -n 50 || echo "(no error lines matched)"

      # ─── 11. Verify boot artifacts ───────────────────────────────────
      - name: Verify boot artifacts
        working-directory: kernel
        run: |
          set -e

          if [ -f out/arch/arm64/boot/Image ]; then
            echo "✔ out/arch/arm64/boot/Image ($(du -sh out/arch/arm64/boot/Image | cut -f1))"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "✔ out/arch/arm64/boot/Image.gz ($(du -sh out/arch/arm64/boot/Image.gz | cut -f1))"
          else
            echo "✘ MISSING: Image or Image.gz"
            exit 1
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            echo "✔ out/arch/arm64/boot/dtbo.img ($(du -sh out/arch/arm64/boot/dtbo.img | cut -f1))"
          else
            echo "— dtbo.img not found"
          fi

          if [ -f out/arch/arm64/boot/dtb ]; then
            echo "✔ out/arch/arm64/boot/dtb ($(du -sh out/arch/arm64/boot/dtb | cut -f1))"
          else
            echo "— dtb not found"
          fi

      # ─── 12. Package with AnyKernel3 ─────────────────────────────────
      - name: Package zip (AnyKernel3)
        working-directory: kernel
        run: |
          set -e

          DT=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="phoeniX-AOSP-${DT}.zip"
          OUT_DIR="$(pwd)/out"
          AK3_DIR="$(pwd)/anykernel"

          cd "${AK3_DIR}"
          rm -f ./*.zip

          if [ -f "${OUT_DIR}/arch/arm64/boot/Image" ]; then
            cp -f "${OUT_DIR}/arch/arm64/boot/Image" .
          elif [ -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ]; then
            cp -f "${OUT_DIR}/arch/arm64/boot/Image.gz" ./Image
          else
            echo "No kernel Image found"
            exit 1
          fi

          if [ -f "${OUT_DIR}/arch/arm64/boot/dtbo.img" ]; then
            cp -f "${OUT_DIR}/arch/arm64/boot/dtbo.img" .
          fi

          if [ -f "${OUT_DIR}/arch/arm64/boot/dtb" ]; then
            cp -f "${OUT_DIR}/arch/arm64/boot/dtb" .
          fi

          zip -r9 "${ZIP_NAME}" . -x ".git/*" "*.yml" "*.md"
          rm -f Image dtbo.img dtb
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$(pwd)/anykernel/${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "✔ ${ZIP_NAME}"

      # ─── 13. Upload artifacts ─────────────────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 3

      # ─── 14. GitHub Release (optional) ───────────────────────────────
      - name: Create GitHub Release
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phoenix-${{ github.run_number }}
          name: "phoeniX | SM8250 | SukiSU Ultra + SuSFS + GPU OC | #${{ github.run_number }}"
          body: |
            ### phoeniX Kernel for SM8250

            **Features**
            - ✅ SukiSU Ultra (`susfs-main`) — SUSFS v2 built-in
            - ✅ GPU OC — 670 MHz max
            - ✅ AnyKernel3 flashable zip

            **Hook integration (kernel 4.19 non-GKI)**
            - `fs/stat.c` — newfstatat, fstatat64, newfstat, fstat64
            - `fs/exec.c` — do_execve, compat_do_execve
            - `fs/open.c` — faccessat
            - `kernel/reboot.c` — reboot
            - setuid / initrc / input — auto via LSM

            **GPU frequency table**
            | Level | Frequency | Voltage |
