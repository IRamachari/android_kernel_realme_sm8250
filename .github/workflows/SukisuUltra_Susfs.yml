name: Build Kernel (SukiSU Ultra + SuSFS + GPU OC)

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release after build"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: "phoeniX | SM8250 | SukiSU Ultra + SuSFS + GPU OC"
    runs-on: ubuntu-24.04

    steps:
      # ─── 1. Checkout kernel source ───────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      # ─── 2. System dependencies ──────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache \
            curl flex git kmod libelf-dev libssl-dev \
            lz4 python3 unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu cpio

      # ─── 3. ccache ───────────────────────────────────────────────────
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 5G
          key: phoenix-sm8250-${{ github.ref_name }}
          restore-keys: phoenix-sm8250-

      # ─── 4. Toolchain ────────────────────────────────────────────────
      - name: Clone toolchain (ryukftw)
        run: |
          git clone --depth=1 \
            https://gitlab.com/ryukftw/toolchain.git \
            kernel/toolchain

      # ─── 5. AnyKernel3 ───────────────────────────────────────────────
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/bijoyv9/AnyKernel3.git \
            kernel/anykernel

      # ─── 6. SukiSU Ultra — susfs-main branch ─────────────────────────
      #
      #  "susfs-main" is SukiSU Ultra's special branch that bundles SUSFS
      #  v2 directly inside the KSU driver itself. This means:
      #    - No external susfs4ksu kernel patches needed
      #    - No API mismatch (the driver and SUSFS headers are in sync)
      #    - Supports non-GKI device builds
      #
      - name: Add SukiSU Ultra (susfs-main) to kernel source tree
        working-directory: kernel
        run: |
          echo "──────────────────────────────────────"
          echo " Adding SukiSU Ultra (susfs-main)"
          echo "──────────────────────────────────────"
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s susfs-main
          echo "✔ KernelSU tree: $(ls KernelSU/)"


      # ─── 6b. Suppress Clang 20 strict warnings in KernelSU driver ────
      #
      #  Clang 20 rejects K&R implicit-int and no-prototype declarations
      #  as errors (-Werror,-Wimplicit-int / -Wimplicit-function-declaration).
      #  SukiSU Ultra's core/init.c has one such pattern. We patch only the
      #  kernelsu driver's Makefile to relax those two warnings, leaving the
      #  rest of the kernel build strict.
      #
      - name: Fix KernelSU driver Clang 20 compatibility
        working-directory: kernel
        run: |
          MAKEFILE="drivers/kernelsu/Makefile"
          if [ -f "$MAKEFILE" ]; then
            # Append warning suppression flags only if not already present
            if ! grep -q "Wno-implicit-int" "$MAKEFILE"; then
              echo '' >> "$MAKEFILE"
              echo 'ccflags-y += -Wno-implicit-int -Wno-implicit-function-declaration -Wno-int-conversion' >> "$MAKEFILE"
              echo "✔ Patched $MAKEFILE for Clang 20 compatibility"
            else
              echo "-- Already patched"
            fi
          else
            echo "!! $MAKEFILE not found"
          fi

      # ─── 7. Manual hooks for non-GKI kernel 4.19 ─────────────────────
      #
      #  kprobe is unreliable on non-GKI 4.19. Four files need call-site
      #  injection. The Python script uses regex so it survives minor
      #  line-number drift between kernel versions.
      #
      #  Required:
      #    fs/stat.c       — newfstatat + fstatat64 entry; newfstat + fstat64 return
      #    fs/exec.c       — do_execve + compat_do_execve entry
      #    fs/open.c       — faccessat entry (4.19+ do_faccessat path)
      #    kernel/reboot.c — reboot syscall entry
      #
      #  Auto via LSM (Kconfig only, no source edit needed):
      #    CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK
      #    CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK
      #    CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK
      #
      - name: Apply SukiSU Ultra manual hooks
        working-directory: kernel
        run: |
          python3 - <<'PYEOF'
          import re

          def patch_file(path, replacements):
              try:
                  with open(path, 'r') as f:
                      src = f.read()
              except FileNotFoundError:
                  print(f"  !! {path} not found — skipping")
                  return False
              original = src
              for pattern, replacement in replacements:
                  src, n = re.subn(pattern, replacement, src, flags=re.MULTILINE)
                  if n == 0:
                      print(f"  ?? no match: {repr(pattern[:60])}")
              if src == original:
                  print(f"  -- {path}: no changes (already patched?)")
                  return False
              with open(path, 'w') as f:
                  f.write(src)
              print(f"  ✔ patched: {path}")
              return True

          print("═══════════════════════════════════════")
          print(" SukiSU Ultra manual hooks (4.19)")
          print("═══════════════════════════════════════")

          # ── fs/stat.c ─────────────────────────────────────────────────
          print("\n→ fs/stat.c")
          patch_file("fs/stat.c", [
              (
                  r'(#if !defined\(__ARCH_WANT_STAT64\) \|\| defined\(__ARCH_WANT_SYS_NEWFSTATAT\))',
                  '#ifdef CONFIG_KSU\n'
                  '__attribute__((hot))\n'
                  'extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n'
                  'extern void ksu_handle_newfstat_ret(unsigned int *fd, struct stat __user **statbuf_ptr);\n'
                  '#if defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_COMPAT_STAT64)\n'
                  'extern void ksu_handle_fstat64_ret(unsigned long *fd, struct stat64 __user **statbuf_ptr);\n'
                  '#endif\n'
                  '#endif\n\n'
                  r'\1'
              ),
              (
                  r'(SYSCALL_DEFINE4\(newfstatat, int, dfd, const char __user \*, filename,\s*'
                  r'struct stat __user \*, statbuf, int, flag\)\s*\{)\s*'
                  r'((\s*struct kstat stat;\s*\n\s*int error;\s*\n))',
                  r'\1\n'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_stat(&dfd, &filename, &flag);\n'
                  '#endif\n'
                  r'\2'
              ),
              (
                  r'(SYSCALL_DEFINE4\(fstatat64, int, dfd, const char __user \*, filename,\s*'
                  r'struct stat64 __user \*, statbuf, int, flag\)\s*\{)\s*'
                  r'((\s*struct kstat stat;\s*\n\s*int error;\s*\n))',
                  r'\1\n'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_stat(&dfd, &filename, &flag);\n'
                  '#endif\n'
                  r'\2'
              ),
              (
                  r'(SYSCALL_DEFINE2\(newfstat, unsigned int, fd, struct stat __user \*, statbuf\)'
                  r'.*?if \(!error\)\s*\n\s*error = cp_new_stat\(&stat, statbuf\);)',
                  r'\1\n'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_newfstat_ret(&fd, &statbuf);\n'
                  '#endif'
              ),
              (
                  r'(SYSCALL_DEFINE2\(fstat64, unsigned long, fd, struct stat64 __user \*, statbuf\)'
                  r'.*?if \(!error\)\s*\n\s*error = cp_new_stat64\(&stat, statbuf\);)',
                  r'\1\n'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_fstat64_ret(&fd, &statbuf);\n'
                  '#endif'
              ),
          ])

          # ── fs/exec.c ─────────────────────────────────────────────────
          print("\n→ fs/exec.c")
          patch_file("fs/exec.c", [
              (
                  r'(^int do_execve\(struct filename)',
                  '#ifdef CONFIG_KSU\n'
                  '__attribute__((hot))\n'
                  'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n'
                  '\t\t\t\tvoid *argv, void *envp, int *flags);\n'
                  '#endif\n\n'
                  r'\1'
              ),
              (
                  r'(int do_execve\(struct filename \*filename,\s*\n'
                  r'\s*const char __user \*const __user \*__argv,\s*\n'
                  r'\s*const char __user \*const __user \*__envp\)\s*\n'
                  r'\{\s*\n'
                  r'\s*struct user_arg_ptr argv = \{ \.ptr\.native = __argv \};\s*\n'
                  r'\s*struct user_arg_ptr envp = \{ \.ptr\.native = __envp \};\s*\n)'
                  r'(\s*return do_execveat_common)',
                  r'\1'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n'
                  '#endif\n'
                  r'\2'
              ),
              (
                  r'(compat_do_execve\(.*?\n(?:.*?\n)*?\s*\.is_compat = true,\s*\n'
                  r'\s*\.ptr\.compat = __envp,\s*\n\s*\};\s*\n)'
                  r'(\s*return do_execveat_common)',
                  r'\1'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n'
                  '#endif\n'
                  r'\2'
              ),
          ])

          # ── fs/open.c ─────────────────────────────────────────────────
          print("\n→ fs/open.c")
          patch_file("fs/open.c", [
              (
                  r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\))',
                  '#ifdef CONFIG_KSU\n'
                  '__attribute__((hot))\n'
                  'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n'
                  '\t\t\t\tint *mode, int *flags);\n'
                  '#endif\n\n'
                  r'\1'
              ),
              (
                  r'(SYSCALL_DEFINE3\(faccessat, int, dfd, const char __user \*, filename, int, mode\)\s*\n'
                  r'\{)\s*\n'
                  r'(\s*return do_faccessat)',
                  r'\1\n'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n'
                  '#endif\n'
                  r'\2'
              ),
          ])

          # ── kernel/reboot.c ───────────────────────────────────────────
          print("\n→ kernel/reboot.c")
          patch_file("kernel/reboot.c", [
              (
                  r'(SYSCALL_DEFINE4\(reboot, int, magic1, int, magic2, unsigned int, cmd,\s*\n'
                  r'\s*void __user \*, arg\))',
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_sys_reboot(int magic1, int magic2,\n'
                  '\t\t\tunsigned int cmd, void __user **arg);\n'
                  '#endif\n\n'
                  r'\1'
              ),
              (
                  r'(SYSCALL_DEFINE4\(reboot.*?\{.*?'
                  r'char buffer\[256\];\s*\n\s*int ret = 0;\s*\n)'
                  r'(\s*/\* We only trust)',
                  r'\1'
                  '#ifdef CONFIG_KSU\n'
                  '\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n'
                  '#endif\n'
                  r'\2',
              ),
          ])

          print("\n═══════════════════════════════════════")
          print(" ✔ All hooks applied")
          print("═══════════════════════════════════════")
          PYEOF

      # ─── 8. GPU frequency + voltage table (KonaBess config) ──────────
      #
      #  Patches the SM8250/kona GPU DTS with:
      #    - 6-level power table: 670 / 525 / 490 / 441 / 305 / 150 MHz
      #    - Extreme undervolt OPP table (KonaBess values)
      #
      #  The script searches common SM8250 DTS locations automatically.
      #
      - name: Patch GPU frequency and voltage table
        working-directory: kernel
        run: |
          python3 - <<'PYEOF'
          import re, os, glob

          # ── New GPU power levels block (6 active levels + idle) ───────
          # Frequencies (hex): 0x27BC86C0=670MHz, 0x1F4ADD40=525MHz,
          #   0x1D34CE80=490MHz, 0x1A524800=441.6MHz, 0x122DEE40=305MHz,
          #   0x08F0D180=150MHz
          NEW_PWRLEVELS = '''\
          qcom,gpu-pwrlevels-0 {
          \t#address-cells = <0x1>;
          \t#size-cells = <0x0>;
          \tqcom,speed-bin = <0x0>;
          \tqcom,initial-pwrlevel = <0x1>;
          \tqcom,throttle-pwrlevel = <0>;

          \tqcom,gpu-pwrlevel@0 {
          \t\treg = <0>;
          \t\tqcom,gpu-freq = <0x27BC86C0>;
          \t\tqcom,bus-freq-ddr7 = <0xb>; qcom,bus-min-ddr7 = <0xb>; qcom,bus-max-ddr7 = <0xb>;
          \t\tqcom,bus-freq-ddr8 = <0xb>; qcom,bus-min-ddr8 = <0xb>; qcom,bus-max-ddr8 = <0xb>;
          \t\tqcom,acd-level = <0x802b5ffd>;
          \t};
          \tqcom,gpu-pwrlevel@1 {
          \t\treg = <1>;
          \t\tqcom,gpu-freq = <0x1F4ADD40>;
          \t\tqcom,bus-freq-ddr7 = <0x9>; qcom,bus-min-ddr7 = <0x9>; qcom,bus-max-ddr7 = <0xb>;
          \t\tqcom,bus-freq-ddr8 = <0x8>; qcom,bus-min-ddr8 = <0x8>; qcom,bus-max-ddr8 = <0xb>;
          \t\tqcom,acd-level = <0x802b5ffd>;
          \t};
          \tqcom,gpu-pwrlevel@2 {
          \t\treg = <2>;
          \t\tqcom,gpu-freq = <0x1D34CE80>;
          \t\tqcom,bus-freq-ddr7 = <0x9>; qcom,bus-min-ddr7 = <0x6>; qcom,bus-max-ddr7 = <0x9>;
          \t\tqcom,bus-freq-ddr8 = <0x8>; qcom,bus-min-ddr8 = <0x7>; qcom,bus-max-ddr8 = <0x9>;
          \t\tqcom,acd-level = <0xa02b5ffd>;
          \t};
          \tqcom,gpu-pwrlevel@3 {
          \t\treg = <3>;
          \t\tqcom,gpu-freq = <0x1A524800>;
          \t\tqcom,bus-freq-ddr7 = <0x9>; qcom,bus-min-ddr7 = <0x6>; qcom,bus-max-ddr7 = <0x9>;
          \t\tqcom,bus-freq-ddr8 = <0x8>; qcom,bus-min-ddr8 = <0x7>; qcom,bus-max-ddr8 = <0x9>;
          \t\tqcom,acd-level = <0xa02b5ffd>;
          \t};
          \tqcom,gpu-pwrlevel@4 {
          \t\treg = <4>;
          \t\tqcom,gpu-freq = <0x122DEE40>;
          \t\tqcom,bus-freq-ddr7 = <0x7>; qcom,bus-min-ddr7 = <0x6>; qcom,bus-max-ddr7 = <0x9>;
          \t\tqcom,bus-freq-ddr8 = <0x8>; qcom,bus-min-ddr8 = <0x6>; qcom,bus-max-ddr8 = <0x9>;
          \t\tqcom,acd-level = <0xa02b5ffd>;
          \t};
          \tqcom,gpu-pwrlevel@5 {
          \t\treg = <5>;
          \t\tqcom,gpu-freq = <0x08F0D180>;
          \t\tqcom,bus-freq-ddr7 = <0x3>; qcom,bus-min-ddr7 = <0x2>; qcom,bus-max-ddr7 = <0x9>;
          \t\tqcom,bus-freq-ddr8 = <0x3>; qcom,bus-min-ddr8 = <0x2>; qcom,bus-max-ddr8 = <0x9>;
          \t\tqcom,acd-level = <0xa02b5ffd>;
          \t};
          \tqcom,gpu-pwrlevel@6 {
          \t\treg = <6>;
          \t\tqcom,gpu-freq = <0x0>;
          \t\tqcom,bus-freq = <0x0>; qcom,bus-min = <0x0>; qcom,bus-max = <0x0>;
          \t};
          };'''

          # ── New OPP voltage table (KonaBess extreme undervolt) ────────
          NEW_OPP = '''\
          gpu_opp_table: opp-table {
          \tcompatible = "operating-points-v2";

          \topp-670000000 { opp-hz = /bits/ 64 <670000000>; opp-microvolt = <200>; };
          \topp-587000000 { opp-hz = /bits/ 64 <587000000>; opp-microvolt = <140>; };
          \topp-525000000 { opp-hz = /bits/ 64 <525000000>; opp-microvolt = <135>; };
          \topp-490000000 { opp-hz = /bits/ 64 <490000000>; opp-microvolt = <80>;  };
          \topp-441600000 { opp-hz = /bits/ 64 <441600000>; opp-microvolt = <80>;  };
          \topp-305000000 { opp-hz = /bits/ 64 <305000000>; opp-microvolt = <40>;  };
          \topp-150000000 { opp-hz = /bits/ 64 <150000000>; opp-microvolt = <16>;  };
          };'''

          # ── Find SM8250/kona DTS files ────────────────────────────────
          candidates = [
              "arch/arm64/boot/dts/qcom/kona.dtsi",
              "arch/arm64/boot/dts/qcom/sm8250.dtsi",
              "arch/arm64/boot/dts/qcom/kona-gpu.dtsi",
          ]
          # Also glob for any oplus/realme device DTS that references pwrlevels
          candidates += glob.glob("arch/arm64/boot/dts/**/*.dtsi", recursive=True)
          candidates += glob.glob("arch/arm64/boot/dts/**/*.dts",  recursive=True)

          patched_pwrlevel = False
          patched_opp      = False

          for path in candidates:
              if not os.path.isfile(path):
                  continue
              with open(path, 'r', errors='replace') as f:
                  src = f.read()

              changed = False

              # Replace full qcom,gpu-pwrlevels-0 { ... }; block
              if not patched_pwrlevel and 'qcom,gpu-pwrlevels-0' in src:
                  new_src, n = re.subn(
                      r'qcom,gpu-pwrlevels-0\s*\{[^}]*(?:\{[^}]*\}[^}]*)*\};',
                      NEW_PWRLEVELS,
                      src, flags=re.DOTALL
                  )
                  if n:
                      src = new_src
                      changed = True
                      patched_pwrlevel = True
                      print(f"  ✔ GPU power levels → {path}")

              # Replace gpu_opp_table / opp-table block
              if not patched_opp and ('gpu_opp_table' in src or 'gpu-opp-table' in src):
                  new_src, n = re.subn(
                      r'gpu_opp_table\s*:\s*opp-table\s*\{[^}]*(?:\{[^}]*\}[^}]*)*\};',
                      NEW_OPP,
                      src, flags=re.DOTALL
                  )
                  if n:
                      src = new_src
                      changed = True
                      patched_opp = True
                      print(f"  ✔ GPU OPP voltage table → {path}")

              if changed:
                  with open(path, 'w') as f:
                      f.write(src)

          if not patched_pwrlevel:
              print("  ?? qcom,gpu-pwrlevels-0 not found in any DTS — skipping power level patch")
          if not patched_opp:
              print("  ?? gpu_opp_table not found in any DTS — skipping OPP voltage patch")
          PYEOF

      # ─── 9. Generate .config ─────────────────────────────────────────
      - name: Generate .config
        working-directory: kernel
        run: |
          CLANG_BIN=$(pwd)/toolchain/clang/bin
          CROSS_COMPILE=$(pwd)/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          OUT_DIR=$(pwd)/out

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KERNEL_SRC=${OUT_DIR}
          export PATH="${CLANG_BIN}:${PATH}"

          TARGET_KERNEL_MAKE_ENV="CC=${CLANG_BIN}/clang"
          LLVM_TOOLS="NM=${CLANG_BIN}/llvm-nm \
                      OBJCOPY=${CLANG_BIN}/llvm-objcopy \
                      OBJDUMP=${CLANG_BIN}/llvm-objdump \
                      STRIP=${CLANG_BIN}/llvm-strip"
          CONFIG="vendor/kona-perf_defconfig vendor/oplus.config"

          echo "→ Generating .config from defconfig"
          make O=${OUT_DIR} \
               ${TARGET_KERNEL_MAKE_ENV} \
               LLVM_IAS=1 \
               ARCH=arm64 \
               CROSS_COMPILE=${CROSS_COMPILE} \
               ${LLVM_TOOLS} \
               ${CONFIG}

          echo "→ Enabling SukiSU Ultra Kconfig options"
          ./scripts/config --file ${OUT_DIR}/.config \
            -e KSU \
            -e KSU_MANUAL_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
            -e KSU_MANUAL_HOOK_AUTO_INPUT_HOOK \
            2>/dev/null || true

          echo "→ Enabling KALLSYMS + KALLSYMS_ALL"
          ./scripts/config --file ${OUT_DIR}/.config \
            -e KALLSYMS \
            -e KALLSYMS_ALL \
            2>/dev/null || true

          make O=${OUT_DIR} ARCH=arm64 olddefconfig
          echo "✔ Config ready"

          echo "── Config verification ──────────────────"
          for opt in CONFIG_KSU CONFIG_KSU_MANUAL_HOOK \
                     CONFIG_KALLSYMS CONFIG_KALLSYMS_ALL \
                     CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK \
                     CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK \
                     CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK; do
            val=$(grep "^${opt}=" ${OUT_DIR}/.config 2>/dev/null || echo "${opt}=NOT SET")
            echo "  $val"
          done

      # ─── 10. Build kernel ─────────────────────────────────────────────
      - name: Compile kernel
        working-directory: kernel
        run: |
          set -o pipefail

          CLANG_BIN=$(pwd)/toolchain/clang/bin
          CROSS_COMPILE=$(pwd)/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          OUT_DIR=$(pwd)/out

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KERNEL_SRC=${OUT_DIR}
          export PATH="${CLANG_BIN}:${PATH}"
          export CCACHE_EXEC="${CLANG_BIN}/clang"
          export USE_CCACHE=1
          export CCACHE_DIR="${HOME}/.ccache"

          TARGET_KERNEL_MAKE_ENV="CC=${CLANG_BIN}/clang"
          LLVM_TOOLS="NM=${CLANG_BIN}/llvm-nm \
                      OBJCOPY=${CLANG_BIN}/llvm-objcopy \
                      OBJDUMP=${CLANG_BIN}/llvm-objdump \
                      STRIP=${CLANG_BIN}/llvm-strip"

          echo "──────────────────────────────────────"
          echo " Building kernel"
          echo "──────────────────────────────────────"
          make ARCH=arm64 \
               CROSS_COMPILE=${CROSS_COMPILE} \
               LLVM_IAS=1 \
               O=${OUT_DIR} \
               ${TARGET_KERNEL_MAKE_ENV} \
               ${LLVM_TOOLS} \
               -j$(nproc --all) 2>&1 | tee build.log

          echo "✔ Kernel build complete"

      - name: Show build errors (on failure)
        if: failure()
        working-directory: kernel
        run: |
          if [ ! -f build.log ]; then
            echo "build.log not found — make did not start"; exit 0
          fi
          echo "──────────────────────────────────────"
          echo " Last 120 lines of build.log"
          echo "──────────────────────────────────────"
          tail -n 120 build.log
          echo ""
          echo "── Filtered errors ───────────────────"
          grep -nE "error:|undefined reference|cannot find|fatal:|ld:" build.log \
            | tail -n 50 || echo "(no error lines matched)"

      # ─── 11. Verify boot artifacts ───────────────────────────────────
      - name: Verify boot artifacts
        working-directory: kernel
        run: |
          for f in out/arch/arm64/boot/Image \
                   out/arch/arm64/boot/dtbo.img \
                   out/arch/arm64/boot/dtb; do
            if [ -f "$f" ]; then
              echo "✔ $f  ($(du -sh $f | cut -f1))"
            else
              echo "✘ MISSING: $f" && exit 1
            fi
          done

      # ─── 12. Package with AnyKernel3 ─────────────────────────────────
      - name: Package zip (AnyKernel3)
        working-directory: kernel
        run: |
          DT=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="phoeniX-AOSP-${DT}.zip"

          cd anykernel
          rm -f ./*.zip
          cp ../out/arch/arm64/boot/Image    .
          cp ../out/arch/arm64/boot/dtbo.img .
          cp ../out/arch/arm64/boot/dtb      .
          zip -r9 "${ZIP_NAME}" * -x ".git/*" "*.yml" "*.md"
          rm -f Image dtbo.img dtb
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}"                  >> $GITHUB_ENV
          echo "ZIP_PATH=$(pwd)/anykernel/${ZIP_NAME}" >> $GITHUB_ENV
          echo "✔ ${ZIP_NAME}"

      # ─── 13. Upload artifacts ─────────────────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 3

      # ─── 14. GitHub Release (optional) ───────────────────────────────
      - name: Create GitHub Release
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phoenix-${{ github.run_number }}
          name: "phoeniX | SM8250 | SukiSU Ultra + SuSFS + GPU OC | #${{ github.run_number }}"
          body: |
            ### phoeniX Kernel for SM8250

            **Features**
            - ✅ SukiSU Ultra (`susfs-main`) — SUSFS v2 built-in, no separate patches
            - ⚠️ KPM disabled (non-GKI 4.19 — uapi header path unsupported)
            - ✅ GPU OC — 670 MHz max (KonaBess extreme undervolt table)
            - ✅ AnyKernel3 flashable zip

            **Hook integration (kernel 4.19 non-GKI)**
            - `fs/stat.c` — newfstatat, fstatat64, newfstat, fstat64
            - `fs/exec.c` — do_execve, compat_do_execve
            - `fs/open.c` — faccessat
            - `kernel/reboot.c` — reboot
            - setuid / initrc / input — auto via LSM

            **GPU frequency table**
            | Level | Frequency | Voltage |
            |-------|-----------|---------|
            | 0 | 670 MHz | 200 µV |
            | 1 | 587 MHz | 140 µV |
            | 2 | 525 MHz | 135 µV |
            | 3 | 490 MHz | 80 µV  |
            | 4 | 441 MHz | 80 µV  |
            | 5 | 305 MHz | 40 µV  |
            | 6 | 150 MHz | 16 µV  |

            **Build info**
            - Commit: `${{ github.sha }}`
            - Run: `#${{ github.run_number }}`

            > Flash via TWRP. Install SukiSU Ultra Manager APK after first boot.
          files: ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
