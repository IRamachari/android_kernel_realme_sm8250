name: Build Kernel (SuSFS + APatch)

on:
  workflow_dispatch:
    inputs:
      susfs_branch:
        description: "SuSFS branch (e.g. kernel-4.19)"
        required: false
        default: "kernel-4.19"
      release:
        description: "Create a GitHub Release after build"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: "phoeniX | SM8250 | SuSFS + APatch"
    runs-on: ubuntu-22.04

    steps:
      # ─── 1. Kernel source ────────────────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      # ─── 2. System dependencies ──────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache \
            curl flex git kmod libelf-dev libssl-dev \
            lz4 python3 unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu cpio

      # ─── 3. ccache ───────────────────────────────────────────────────
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 5G
          key: phoenix-sm8250-${{ github.ref_name }}
          restore-keys: phoenix-sm8250-

      # ─── 4. Toolchain ────────────────────────────────────────────────
      - name: Clone toolchain (ryukftw)
        run: |
          git clone --depth=1 \
            https://gitlab.com/ryukftw/toolchain.git \
            kernel/toolchain

      # ─── 5. AnyKernel3 ───────────────────────────────────────────────
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/bijoyv9/AnyKernel3.git \
            kernel/anykernel

      # ─── 6. SuSFS patches ────────────────────────────────────────────
      - name: Clone SuSFS
        run: |
          git clone --depth=1 \
            -b ${{ inputs.susfs_branch }} \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            /tmp/susfs4ksu

      - name: Apply SuSFS patches
        working-directory: kernel
        run: |
          PATCH_DIR=/tmp/susfs4ksu/kernel_patches

          echo "──────────────────────────────────────"
          echo " Applying SuSFS patches"
          echo "──────────────────────────────────────"

          # Core kernel patch for 4.19
          for PATCH in \
            "add_susfs_in_kernel-4.19.patch" \
            "add_sus_su_support_for_non_gki.patch" \
            "fs_susfs.patch"; do
            if [ -f "$PATCH_DIR/$PATCH" ]; then
              echo "→ Applying: $PATCH"
              patch -p1 --forward --no-backup-if-mismatch \
                < "$PATCH_DIR/$PATCH" || \
                echo "  (already applied or minor conflict — continuing)"
            fi
          done

          # Copy susfs source files
          echo "→ Copying susfs source files"
          cp -v "$PATCH_DIR/fs/susfs.c"              fs/              2>/dev/null || true
          cp -v "$PATCH_DIR/include/linux/susfs.h"   include/linux/   2>/dev/null || true
          cp -v "$PATCH_DIR/fs/sus_su.c"             fs/              2>/dev/null || true
          cp -v "$PATCH_DIR/include/linux/sus_su.h"  include/linux/   2>/dev/null || true

          echo "✔ SuSFS patches applied"

      # ─── 7. APatch super key injection ───────────────────────────────
      - name: Inject APatch super key
        working-directory: kernel
        env:
          APATCH_SUPERKEY: ${{ secrets.APATCH_SUPERKEY }}
        run: |
          if [ -z "$APATCH_SUPERKEY" ]; then
            echo "ERROR: Secret APATCH_SUPERKEY is not set!" >&2
            exit 1
          fi

          # Mask from all future log output immediately
          echo "::add-mask::${APATCH_SUPERKEY}"

          echo "──────────────────────────────────────"
          echo " Injecting APatch super key"
          echo "──────────────────────────────────────"

          # Method A: Kconfig fragment (picked up via merge_config)
          echo "CONFIG_APATCH_SUPERKEY=\"${APATCH_SUPERKEY}\"" \
            > arch/arm64/configs/apatch_superkey.config
          echo "→ wrote arch/arm64/configs/apatch_superkey.config"

          # Method B: C header (for APatch patches that #include it)
          mkdir -p include/linux
          cat > include/linux/apatch_key.h <<EOF
          /* Auto-generated by CI — do not edit or commit */
          #ifndef _APATCH_KEY_H
          #define _APATCH_KEY_H
          #define APATCH_SUPER_KEY "${APATCH_SUPERKEY}"
          #endif /* _APATCH_KEY_H */
          EOF
          echo "→ wrote include/linux/apatch_key.h"

          echo "✔ APatch super key injected"

      # ─── 8. Build ─────────────────────────────────────────────────────
      - name: Compile kernel
        working-directory: kernel
        run: |
          # ── Mirror build.sh variable setup exactly ──────────────────
          MAKE_PATH=$(pwd)/toolchain/build-tools/bin
          CROSS_COMPILE=$(pwd)/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          CLANG_BIN=$(pwd)/toolchain/clang/bin
          OUT_DIR=$(pwd)/out
          ARCH=arm64

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KERNEL_SRC=${OUT_DIR}
          # Only prepend clang bin — do NOT add build-tools/bin to PATH.
          # Android's build-tools bison requires internal m4 files that
          # don't exist on GitHub runners, breaking kconfig generation.
          export PATH="${CLANG_BIN}:${PATH}"

          # ccache via CCACHE_EXEC instead of wrapping CC directly.
          # Wrapping as "CC=ccache /path/clang" causes make to split it
          # into two tokens, passing "-r" and other flags to ccache itself.
          export CCACHE_EXEC="${CLANG_BIN}/clang"
          export USE_CCACHE=1
          export CCACHE_DIR="${HOME}/.ccache"

          TARGET_KERNEL_MAKE_ENV="CC=${CLANG_BIN}/clang"
          LLVM_TOOLS="NM=${CLANG_BIN}/llvm-nm \
                      OBJCOPY=${CLANG_BIN}/llvm-objcopy \
                      OBJDUMP=${CLANG_BIN}/llvm-objdump \
                      STRIP=${CLANG_BIN}/llvm-strip"

          CONFIG="vendor/kona-perf_defconfig vendor/oplus.config"

          echo "──────────────────────────────────────"
          echo " Step 1 — Generate .config"
          echo "──────────────────────────────────────"
          make O=${OUT_DIR} \
               ${TARGET_KERNEL_MAKE_ENV} \
               LLVM_IAS=1 \
               ARCH=${ARCH} \
               CROSS_COMPILE=${CROSS_COMPILE} \
               ${LLVM_TOOLS} \
               ${CONFIG}

          # Merge APatch super key Kconfig fragment
          if [ -f arch/arm64/configs/apatch_superkey.config ]; then
            echo "→ Merging APatch super key config fragment"
            ./scripts/kconfig/merge_config.sh -m -O ${OUT_DIR} \
              ${OUT_DIR}/.config \
              arch/arm64/configs/apatch_superkey.config
            make O=${OUT_DIR} ARCH=${ARCH} olddefconfig
          fi

          # Enable SuSFS in .config
          echo "→ Enabling SuSFS config options"
          ./scripts/config --file ${OUT_DIR}/.config \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            2>/dev/null || true
          make O=${OUT_DIR} ARCH=${ARCH} olddefconfig

          echo "──────────────────────────────────────"
          echo " Step 2 — Build kernel"
          echo "──────────────────────────────────────"
          make ARCH=${ARCH} \
               CROSS_COMPILE=${CROSS_COMPILE} \
               LLVM_IAS=1 \
               O=${OUT_DIR} \
               ${TARGET_KERNEL_MAKE_ENV} \
               ${LLVM_TOOLS} \
               -j$(nproc --all) 2>&1 | tee build.log

          echo "✔ Kernel build complete"

      # ─── 9. Check build output ───────────────────────────────────────
      - name: Verify build artifacts
        working-directory: kernel
        run: |
          echo "── Boot artifacts ──────────────────────"
          for f in out/arch/arm64/boot/Image \
                   out/arch/arm64/boot/dtbo.img \
                   out/arch/arm64/boot/dtb; do
            if [ -f "$f" ]; then
              echo "✔ $f ($(du -sh $f | cut -f1))"
            else
              echo "✘ MISSING: $f" && exit 1
            fi
          done

      # ─── 10. Package with AnyKernel3 ─────────────────────────────────
      - name: Package zip (AnyKernel3)
        working-directory: kernel
        run: |
          DT=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="phoeniX-AOSP-${DT}.zip"

          echo "── Zipping: ${ZIP_NAME} ─────────────────"
          cd anykernel
          rm -f ./*.zip

          cp ../out/arch/arm64/boot/Image   .
          cp ../out/arch/arm64/boot/dtbo.img .
          cp ../out/arch/arm64/boot/dtb      .

          zip -r9 "${ZIP_NAME}" * -x ".git/*" "*.yml" "*.md"

          rm -f Image dtbo.img dtb
          cd ..

          # Save zip name for later steps
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "ZIP_PATH=$(pwd)/anykernel/${ZIP_NAME}" >> $GITHUB_ENV
          echo "✔ Package ready: ${ZIP_NAME}"

      # ─── 11. Upload artifact ─────────────────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 3

      # ─── 12. GitHub Release (optional) ───────────────────────────────
      - name: Create GitHub Release
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phoenix-${{ github.run_number }}
          name: "phoeniX | SM8250 | SuSFS + APatch | ${{ github.run_number }}"
          body: |
            ### phoeniX Kernel for SM8250

            **Features**
            - ✅ SuSFS patches (`${{ inputs.susfs_branch }}`)
            - ✅ APatch super key embedded at compile time
            - ✅ AnyKernel3 flashable zip

            **Build info**
            - Commit: `${{ github.sha }}`
            - Run: `#${{ github.run_number }}`
            - Date: `${{ github.event.repository.updated_at }}`
          files: ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
