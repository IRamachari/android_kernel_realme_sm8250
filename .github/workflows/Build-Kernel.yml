name: Build Kernel (SuSFS + APatch)

on:
  workflow_dispatch:
    inputs:
      susfs_branch:
        description: "SuSFS branch"
        required: false
        default: "kernel-4.19"
      release:
        description: "Create a GitHub Release after build"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: "phoeniX | SM8250 | SuSFS + APatch"
    runs-on: ubuntu-22.04

    steps:
      # ─── 1. Checkout kernel source ───────────────────────────────────
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      # ─── 2. System dependencies ──────────────────────────────────────
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache \
            curl flex git kmod libelf-dev libssl-dev \
            lz4 python3 unzip wget zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu cpio

      # ─── 3. ccache ───────────────────────────────────────────────────
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 5G
          key: phoenix-sm8250-${{ github.ref_name }}
          restore-keys: phoenix-sm8250-

      # ─── 4. Toolchain ────────────────────────────────────────────────
      - name: Clone toolchain (ryukftw)
        run: |
          git clone --depth=1 \
            https://gitlab.com/ryukftw/toolchain.git \
            kernel/toolchain

      # ─── 5. AnyKernel3 ───────────────────────────────────────────────
      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/bijoyv9/AnyKernel3.git \
            kernel/anykernel

      # ─── 6. SuSFS patches ────────────────────────────────────────────
      - name: Clone SuSFS
        run: |
          git clone --depth=1 \
            -b ${{ inputs.susfs_branch }} \
            https://gitlab.com/simonpunk/susfs4ksu.git \
            /tmp/susfs4ksu

      - name: Apply SuSFS kernel patches
        working-directory: kernel
        run: |
          PATCH_DIR=/tmp/susfs4ksu/kernel_patches

          echo "──────────────────────────────────────"
          echo " Applying SuSFS patches (kernel-4.19)"
          echo "──────────────────────────────────────"

          # Correct filename always has the 50_ prefix
          MAIN_PATCH="$PATCH_DIR/50_add_susfs_in_kernel-4.19.patch"
          if [ -f "$MAIN_PATCH" ]; then
            echo "→ Applying: 50_add_susfs_in_kernel-4.19.patch"
            patch -p1 --forward --no-backup-if-mismatch < "$MAIN_PATCH" || \
              echo "  (minor fuzz — continuing)"
          else
            echo "ERROR: $MAIN_PATCH not found!" >&2
            echo "Available patches:"
            ls "$PATCH_DIR/"
            exit 1
          fi

          # Copy susfs C source files into the kernel tree
          echo "→ Copying susfs source files"
          cp -v "$PATCH_DIR/fs/susfs.c"            fs/            2>/dev/null || true
          cp -v "$PATCH_DIR/include/linux/susfs.h" include/linux/ 2>/dev/null || true

          echo "✔ SuSFS patches applied"

      # ─── 7. Generate .config ─────────────────────────────────────────
      #
      #  CONFIG_KALLSYMS=y  is REQUIRED by APatch's kptools to locate
      #  kernel symbols in the compiled Image for binary patching.
      #  Without this, kptools cannot parse the kernel and will fail.
      #
      - name: Generate .config
        working-directory: kernel
        run: |
          CLANG_BIN=$(pwd)/toolchain/clang/bin
          CROSS_COMPILE=$(pwd)/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          OUT_DIR=$(pwd)/out

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KERNEL_SRC=${OUT_DIR}
          export PATH="${CLANG_BIN}:${PATH}"

          TARGET_KERNEL_MAKE_ENV="CC=${CLANG_BIN}/clang"
          LLVM_TOOLS="NM=${CLANG_BIN}/llvm-nm \
                      OBJCOPY=${CLANG_BIN}/llvm-objcopy \
                      OBJDUMP=${CLANG_BIN}/llvm-objdump \
                      STRIP=${CLANG_BIN}/llvm-strip"
          CONFIG="vendor/kona-perf_defconfig vendor/oplus.config"

          echo "→ Generating .config from defconfig"
          make O=${OUT_DIR} \
               ${TARGET_KERNEL_MAKE_ENV} \
               LLVM_IAS=1 \
               ARCH=arm64 \
               CROSS_COMPILE=${CROSS_COMPILE} \
               ${LLVM_TOOLS} \
               ${CONFIG}

          echo "→ Enabling CONFIG_KALLSYMS (mandatory for APatch kptools)"
          ./scripts/config --file ${OUT_DIR}/.config \
            -e KALLSYMS \
            --set-val KALLSYMS_ALL n

          echo "→ Enabling SuSFS config options"
          ./scripts/config --file ${OUT_DIR}/.config \
            -e KSU_SUSFS \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT \
            -e KSU_SUSFS_SUS_OVERLAYFS \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
            2>/dev/null || true

          make O=${OUT_DIR} ARCH=arm64 olddefconfig
          echo "✔ Config ready"

      # ─── 8. Build kernel ─────────────────────────────────────────────
      - name: Compile kernel
        working-directory: kernel
        run: |
          CLANG_BIN=$(pwd)/toolchain/clang/bin
          CROSS_COMPILE=$(pwd)/toolchain/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          OUT_DIR=$(pwd)/out

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KERNEL_SRC=${OUT_DIR}
          export PATH="${CLANG_BIN}:${PATH}"
          export CCACHE_EXEC="${CLANG_BIN}/clang"
          export USE_CCACHE=1
          export CCACHE_DIR="${HOME}/.ccache"

          TARGET_KERNEL_MAKE_ENV="CC=${CLANG_BIN}/clang"
          LLVM_TOOLS="NM=${CLANG_BIN}/llvm-nm \
                      OBJCOPY=${CLANG_BIN}/llvm-objcopy \
                      OBJDUMP=${CLANG_BIN}/llvm-objdump \
                      STRIP=${CLANG_BIN}/llvm-strip"

          echo "──────────────────────────────────────"
          echo " Building kernel"
          echo "──────────────────────────────────────"
          make ARCH=arm64 \
               CROSS_COMPILE=${CROSS_COMPILE} \
               LLVM_IAS=1 \
               O=${OUT_DIR} \
               ${TARGET_KERNEL_MAKE_ENV} \
               ${LLVM_TOOLS} \
               -j$(nproc --all) 2>&1 | tee build.log

          echo "✔ Kernel build complete"

      # ─── 9. Verify boot artifacts ────────────────────────────────────
      - name: Verify boot artifacts
        working-directory: kernel
        run: |
          for f in out/arch/arm64/boot/Image \
                   out/arch/arm64/boot/dtbo.img \
                   out/arch/arm64/boot/dtb; do
            if [ -f "$f" ]; then
              echo "✔ $f  ($(du -sh $f | cut -f1))"
            else
              echo "✘ MISSING: $f" && exit 1
            fi
          done

      # ─── 10. APatch — binary-patch the kernel Image ──────────────────
      #
      #  HOW APATCH ACTUALLY WORKS:
      #  APatch does NOT modify kernel source code. Instead, kptools
      #  injects the KernelPatch runtime (kpimg) directly into the
      #  compiled kernel Image binary after build. The superkey is
      #  embedded into this patched Image at this exact step.
      #
      #  Command: kptools-linux -p -i <Image> -k <kpimg> -s <KEY> -o <out>
      #
      - name: Download KernelPatch tools
        run: |
          KP_TAG=$(curl -fsSL \
            https://api.github.com/repos/bmax121/KernelPatch/releases/latest \
            | grep '"tag_name"' | sed 's/.*"tag_name": *"\(.*\)".*/\1/')

          echo "→ KernelPatch release: ${KP_TAG}"
          BASE="https://github.com/bmax121/KernelPatch/releases/download/${KP_TAG}"

          curl -fsSL "${BASE}/kptools-linux" -o /tmp/kptools-linux
          curl -fsSL "${BASE}/kpimg-android" -o /tmp/kpimg-android
          chmod +x /tmp/kptools-linux

          echo "✔ kptools-linux  $(du -sh /tmp/kptools-linux | cut -f1)"
          echo "✔ kpimg-android  $(du -sh /tmp/kpimg-android | cut -f1)"
          echo "KP_TAG=${KP_TAG}" >> $GITHUB_ENV

      - name: Binary-patch Image with APatch superkey
        working-directory: kernel
        env:
          APATCH_SUPERKEY: ${{ secrets.APATCH_SUPERKEY }}
        run: |
          if [ -z "$APATCH_SUPERKEY" ]; then
            echo "ERROR: Secret APATCH_SUPERKEY is not set!" >&2
            exit 1
          fi
          echo "::add-mask::${APATCH_SUPERKEY}"

          IMAGE_IN=out/arch/arm64/boot/Image
          IMAGE_OUT=out/arch/arm64/boot/Image-patched

          echo "──────────────────────────────────────"
          echo " APatch binary patching (kptools)"
          echo " KernelPatch: ${{ env.KP_TAG }}"
          echo "──────────────────────────────────────"

          /tmp/kptools-linux \
            -p \
            -i "${IMAGE_IN}" \
            -k /tmp/kpimg-android \
            -s "${APATCH_SUPERKEY}" \
            -o "${IMAGE_OUT}"

          echo "✔ Patched Image: $(du -sh ${IMAGE_OUT} | cut -f1)"

          # Replace the plain Image so AnyKernel3 picks up the patched one
          cp "${IMAGE_OUT}" "${IMAGE_IN}"
          echo "✔ out/arch/arm64/boot/Image → APatch-patched"

      # ─── 11. Package with AnyKernel3 ─────────────────────────────────
      - name: Package zip (AnyKernel3)
        working-directory: kernel
        run: |
          DT=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="phoeniX-AOSP-${DT}.zip"

          cd anykernel
          rm -f ./*.zip

          cp ../out/arch/arm64/boot/Image    .
          cp ../out/arch/arm64/boot/dtbo.img .
          cp ../out/arch/arm64/boot/dtb      .

          zip -r9 "${ZIP_NAME}" * -x ".git/*" "*.yml" "*.md"
          rm -f Image dtbo.img dtb
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}"            >> $GITHUB_ENV
          echo "ZIP_PATH=$(pwd)/anykernel/${ZIP_NAME}" >> $GITHUB_ENV
          echo "✔ ${ZIP_NAME}"

      # ─── 12. Upload artifacts ─────────────────────────────────────────
      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: kernel/build.log
          retention-days: 3

      # ─── 13. GitHub Release (optional) ───────────────────────────────
      - name: Create GitHub Release
        if: ${{ inputs.release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phoenix-${{ github.run_number }}
          name: "phoeniX | SM8250 | SuSFS + APatch | #${{ github.run_number }}"
          body: |
            ### phoeniX Kernel for SM8250

            **Features**
            - ✅ SuSFS `${{ inputs.susfs_branch }}` kernel patches
            - ✅ APatch `${{ env.KP_TAG }}` — superkey embedded via kptools
            - ✅ AnyKernel3 flashable zip

            **Build info**
            - Commit: `${{ github.sha }}`
            - Run: `#${{ github.run_number }}`

            > Flash via TWRP. After first boot open APatch Manager and enter your SuperKey.
          files: ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
